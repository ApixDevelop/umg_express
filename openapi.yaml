                idClienteDestinatario:
                  type: integer
                  example: 2
                idRuta:
                  type: integer
                  example: 1
                pesoRealKg:
                  type: number
                  format: float
                  example: 5.0
                largoCm:
                  type: number
                  format: float
                  example: 60.0
                anchoCm:
                  type: number
                  format: float
                  example: 50.0
                altoCm:
                  type: number
                  format: float
