                          type: integer
                          example: 1
                        idPiloto:
                          type: integer
                          example: 1
                        numeroGuia:
                          type: integer
                          example: 1001
                        pesoKg:
                          type: number
                          example: 24.0
                        volumenM3:
                          type: number
                          example: 0.12
                        fechaDespacho:
                          type: string
                          example: "2026-10-09 10:15:00"
    post:
      tags:
        - Transacciones - Despacho
      summary: Procesar despacho de guías en un vehículo validando peso y volumen acumulado
      operationId: createDespacho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idVehiculo
                - guias
              properties:
                idVehiculo:
                  type: integer
                  example: 1
                idPiloto:
                  type: integer
                  example: 1
                guias:
                  type: array
                  items:
                    type: integer
                  example: [1001, 1002]
