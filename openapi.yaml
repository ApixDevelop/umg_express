components:
  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: admin
        nombre:
          type: string
          example: Administrador Principal
        rol:
          type: string
          example: Administrador

    UsuarioInput:
      type: object
      required:
        - username
        - password
        - nombre
        - rol
      properties:
        username:
          type: string
          example: operador1
        password:
          type: string
          example: pass123
        nombre:
          type: string
          example: Carlos Gómez
        rol:
          type: string
          enum: [Administrador, Operador, Auditor]
          example: Operador

    UsuarioUpdateInput:
      type: object
      required:
        - username
        - nombre
        - rol
      properties:
        username:
          type: string
          example: operador1
        password:
          type: string
          description: Opcional. Si se envía vacío o se omite, se conserva la contraseña existente.
          example: nuevaPass456
        nombre:
          type: string
          example: Carlos Gómez Actualizado
        rol:
          type: string
          enum: [Administrador, Operador, Auditor]
          example: Operador

    SucursalInput:
      type: object
      required:
        - nombre
        - direccion
        - telefono
      properties:
        nombre:
          type: string
          example: Sucursal Central Guatemala
        direccion:
          type: string
          example: Zona 10, Ciudad de Guatemala
        telefono:
          type: string
          example: 2222-0001

    Sucursal:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/SucursalInput'

    ClienteInput:
      type: object
      required:
        - nit
        - nombre
        - direccion
        - telefono
      properties:
        nit:
          type: string
          example: 1234567-8
        nombre:
          type: string
          example: Distribuidora El Sol, S.A.
        direccion:
          type: string
          example: Calzada Roosevelt 12-45, Zona 11
        telefono:
          type: string
          example: 2440-5555

    Cliente:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/ClienteInput'

    RutaInput:
      type: object
      required:
        - idSucursalOrigen
        - idSucursalDestino
        - distanciaKm
        - tarifaBase
      properties:
        idSucursalOrigen:
          type: integer
          example: 1
        idSucursalDestino:
          type: integer
          example: 2
        distanciaKm:
          type: number
          format: float
          example: 205.5
        tarifaBase:
          type: number
          format: float
          example: 50.0

    Ruta:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/RutaInput'

    VehiculoInput:
      type: object
      required:
        - placa
        - marcaModelo
        - capacidadPesoKg
        - capacidadVolumenM3
        - estado
      properties:
        placa:
          type: string
          example: C-123XYZ
        marcaModelo:
          type: string
          example: Isuzu NPR 2024
        capacidadPesoKg:
          type: number
          format: float
          example: 3500.0
        capacidadVolumenM3:
          type: number
          format: float
          example: 18.5
        estado:
          type: string
          enum: [Disponible, En ruta, En taller]
          example: Disponible

    Vehiculo:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/VehiculoInput'

    PilotoInput:
      type: object
      required:
        - nombre
        - licencia
        - telefono
      properties:
        nombre:
          type: string
          example: Juan Pérez López
        licencia:
          type: string
          example: LIC-987654
        telefono:
          type: string
          example: 5555-4433

    Piloto:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/PilotoInput'

    TarifaInput:
      type: object
      required:
        - tipoCarga
        - precioPorKg
        - precioPorM3
        - recargoEspecial
      properties:
        tipoCarga:
          type: string
          example: Estándar
        precioPorKg:
          type: number
          format: float
          example: 5.0
        precioPorM3:
          type: number
          format: float
          example: 150.0
        recargoEspecial:
          type: number
          format: float
          example: 10.0

    Tarifa:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/TarifaInput'

    Guia:
      type: object
      properties:
        numeroGuia:
          type: integer
          example: 1001
        idClienteRemitente:
          type: integer
          example: 1
        idClienteDestinatario:
          type: integer
          example: 2
        idRuta:
          type: integer
          example: 1
        pesoRealKg:
          type: number
          format: float
          example: 5.0
        largoCm:
          type: number
          format: float
          example: 60.0
        anchoCm:
          type: number
          format: float
          example: 50.0
        altoCm:
          type: number
          format: float
          example: 40.0
        pesoVolumetricoKg:
          type: number
          format: float
          example: 24.0
        pesoFacturableKg:
          type: number
          format: float
          example: 24.0
        costoTotal:
          type: number
          format: float
          example: 285.6
        estado:
          type: string
          enum: [Creada, Despachada, Entregada, Cancelada]
          example: Creada

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Descripción detallada del error

    SuccessMessage:
      type: object
      properties:
