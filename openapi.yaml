        '201':
          description: Despacho realizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Despacho realizado exitosamente y vehículo actualizado a 'En ruta'
                  despacho:
                    type: object
                    properties:
                      idVehiculo:
                        type: integer
                        example: 1
                      idPiloto:
                        type: integer
                        example: 1
                      totalGuias:
                        type: integer
                        example: 2
                      pesoTotalKg:
                        type: number
                        example: 48.0
                      volumenTotalM3:
                        type: number
                        example: 0.24
                      estadoVehiculo:
                        type: string
                        example: En ruta
                      guiasDespachadas:
                        type: array
                        items:
                          type: integer
                        example: [1001, 1002]
        '400':
          description: Exceso de capacidad vehicular, vehículo en taller o guía no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vehículo, piloto o guía no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

