openapi: 3.0.3
info:
  title: UMG Express API
  description: |
    API REST para el sistema de gestión logística y paquetería UMG Express.
    Desarrollado en C++17 utilizando el framework Crow y persistencia binaria (.dat).
  version: 1.0.0
  contact:
    name: UMG Express Team
servers:
  - url: http://127.0.0.1:18080
    description: Servidor Local (Crow C++)

tags:
  - name: Sistema
    description: Health Check y utilidades
  - name: Autenticación
    description: Control de acceso y gestión de usuarios
  - name: Sucursales
    description: Catálogo de sucursales origen y destino
  - name: Clientes
    description: Catálogo de clientes remitentes y destinatarios
  - name: Rutas
    description: Catálogo de rutas de transporte entre sucursales
  - name: Vehículos
    description: Catálogo de flotilla vehicular
  - name: Pilotos
    description: Catálogo de conductores/pilotos
  - name: Tarifas
    description: Catálogo de tarifarios por peso y volumen
  - name: Transacciones - Guías
    description: Emisión y consulta de guías de paquete
  - name: Transacciones - Despacho
    description: Asignación y despacho de carga en vehículos
  - name: Reportes
    description: Rastreo, manifiestos de vehículos y liquidaciones financieras

paths:
  /v1/health:
    get:
      tags:
        - Sistema
      summary: Verificación del estado del servidor
      operationId: checkHealth
      responses:
        '200':
          description: Servidor activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  mensaje:
                    type: string
                    example: UMG Express API funcionando correctamente

  /v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión de usuario
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: admin123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Autenticación exitosa
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Faltan credenciales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas o usuario inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/usuarios:
    get:
      tags:
        - Autenticación
      summary: Listar todos los usuarios activos
      operationId: getUsuarios
      responses:
        '200':
          description: Lista de usuarios activos del sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado (requiere rol Administrador)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Autenticación
      summary: Registrar un nuevo usuario
      operationId: createUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Usuario creado exitosamente
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado (requiere rol Administrador)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/usuarios/{id}:
    get:
      tags:
        - Autenticación
      summary: Obtener usuario por ID
      operationId: getUsuarioById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado (requiere rol Administrador)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado o inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Autenticación
      summary: Actualizar un usuario existente
      operationId: updateUsuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdateInput'
      responses:
        '200':
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  mensaje:
                    type: string
                    example: Usuario actualizado exitosamente
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado (requiere rol Administrador)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado o inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username ya en uso por otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Autenticación
      summary: Eliminar usuario (baja lógica)
      operationId: deleteUsuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Operación no permitida (ej. no se puede eliminar el usuario admin o autoeliminación)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso denegado (requiere rol Administrador)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado o inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/sucursales:
    get:
